<html>
    <head>
        <title>Dom Example</title>
    </head>
    <body>
        <form>
            <h1>Login Form</h1>
            <label>Username:</label>
            <input type="text" name="u1" id="v1"><br><br>
            <label>Password:</label>
            <input type="text" name="u2" id="v2"><br><br>
            <button>login</button>
            <button type="button" onclick="Login()">Reset</button>
            <p id="result">Result:</p>
        </form>
        <p id="para">hello sanjana</p>
        <button onclick="Btn()">change</button>
        <script>
            function Btn(){
              //  alert("I'm function");
              document.getElementById('para').innerHTML = "How are you!";
            };
            function Login(){
                let u1 = document.getElementById('v1').value;
                let u2 = document.getElementById('v2').value;
                document.getElementById('result').innerHTML = "Login successfully"
                result.style.color = "green";
                if(u1 == "sanjana" && u2 == "123"){
                    result.style.color = "green";
                }
            };
        </script>
    </body>
</html>
